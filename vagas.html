<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vagas - Empreende Mossoró</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="app.css">
</head>
<body data-page="vagas">
    <header class="navbar">
        <div class="logo">Empreende <span>Mossoró</span></div>
        <nav><ul class="nav-links"><li><a href="index.html">Início</a></li></ul></nav>
    </header>
    <section class="page">
        <h2>Vagas em Mossoró e região</h2>
        <p class="subtitle" id="resumo"></p>
        <form id="form-filtros" class="filtros">
            <div class="form-group"><label for="f-q">Palavra-chave</label><input type="text" id="f-q" name="q" placeholder="Ex: barista"></div>
            <div class="form-group"><label for="f-area">Área</label><select id="f-area" name="area"></select></div>
            <div class="form-group"><label for="f-mod">Modalidade</label><select id="f-mod" name="modalidade"></select></div>
            <div class="form-group"><label for="f-tipo">Tipo</label><select id="f-tipo" name="tipo"></select></div>
            <div class="form-group"><label for="f-cidade">Cidade</label><input type="text" id="f-cidade" name="cidade"></div>
            <button type="submit" class="btn-submit">Buscar</button>
        </form>
        <div class="msg" id="msg" hidden></div>
        <div class="grid-members" id="resultados"></div>
        <div class="paginacao" id="paginacao"></div>
    </section>

    <footer><p>&copy; 2026 Empreende Mossoró. Conectando negócios, fortalecendo a economia local. ☀️</p></footer>
    <script src="js/boot.js"></script>
</body>
</html>
